# .circleci/config.yml
version: 2.1
setup: true

orbs:
  path-filtering: circleci/path-filtering@0.1.5

workflows:
  setup-workflow:
    jobs:
      - path-filtering/filter:
          name: set-pipeline-flags
          base-revision: main
          # Continue the pipeline using the file below (no `setup:` in it)
          config-path: .circleci/continue.yml
          mapping: |
            # If CircleCI config changes, run everything
            ^\.circleci/.* run-tests true
            ^\.circleci/.* run-build-deploy true

            # App code changes -> run tests AND build/deploy
            ^((app|src|backend|api)/.*|Dockerfile|requirements\.txt)$ run-tests true
            ^((app|src|backend|api)/.*|Dockerfile|requirements\.txt)$ run-build-deploy true

            # Test-only changes -> run tests only
            ^tests/.* run-tests true

            # Docs-only (e.g., README.md) -> leave both flags false (skip)
