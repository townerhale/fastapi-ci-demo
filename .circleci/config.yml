version: 2.1
setup: true

orbs:
  path-filtering: circleci/path-filtering@1.1.0

workflows:
  setup-workflow:
    jobs:
      - path-filtering/filter:
          # Add this executor configuration
          executor:
            name: path-filtering/default
            python-version: "3.11"  # Use Python 3.11
          base-revision: HEAD~1
          config-path: .circleci/continue.yml
          mapping: |
            .* run-tests true
            .* run-build-deploy true