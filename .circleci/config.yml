# .circleci/config.yml
version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1
  aws-ecr: circleci/aws-ecr@9.3.5  # if this ever complains about params, use 9.3.3

jobs:
  # ---------------------------------------------------------------------------
  # 1) Lint and unit tests (unchanged)
  # ---------------------------------------------------------------------------
  lint-and-unit-test:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pip-{{ checksum "requirements.txt" }}
            - v1-pip-
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install --upgrade black pytest pytest-cov
      - save_cache:
          key: v1-pip-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Lint (black --check)
          command: black --check .
      - run:
          name: Run unit tests (tests/unit) with JUnit XML
          command: |
            mkdir -p test-results/unit
            pytest tests/unit -q --junitxml=test-results/unit/pytest.xml
      - store_test_results:
          path: test-results
          when: always

  # ---------------------------------------------------------------------------
  # 2) Integration tests (unchanged)
  # ---------------------------------------------------------------------------
  integration-test:
    docker:
      - image: cimg/python:3.11
        environment:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/appdb
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/appdb
          PIP_CACHE_DIR: ~/.cache/pip
      - image: postgres:14-alpine
        environment:
          POSTGRES_DB: appdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pip-{{ checksum "requirements.txt" }}
            - v1-pip-
      - run:
          name: Install system & Python dependencies
          command: |
            sudo apk update || sudo apt-get update
            (sudo apk add netcat-openbsd || sudo apt-get install -y netcat-openbsd) || true
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install --upgrade pytest pytest-cov
      - save_cache:
          key: v1-pip-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Wait for Postgres to be ready
          command: |
            chmod +x scripts/wait_for_db.sh
            ./scripts/wait_for_db.sh
      - run:
          name: Run Alembic migrations
          command: alembic upgrade head
      - run:
          name: Run integration tests with JUnit XML + HTML coverage
          command: |
            mkdir -p test-results/integration
            pytest tests/integration -q \
              --junitxml=test-results/integration/pytest.xml \
              --cov=app --cov-report=term --cov-report=html:coverage_html
      - store_test_results:
          path: test-results
          when: always
      - store_artifacts:
          path: coverage_html
          destination: coverage_html

  # ---------------------------------------------------------------------------
  # 3) OIDC smoke test (safe, no heredocs). Runs before the push job.
  # ---------------------------------------------------------------------------
  aws-oidc-smoke-test:
    docker:
      - image: cimg/base:stable
    steps:
      - aws-cli/setup:
          profile_name: default
          role_arn: ${AWS_ROLE_ARN}
          role_session_name: circleci-${CIRCLE_WORKFLOW_ID}
          region: ${AWS_REGION}
      - run:
          name: Verify we assumed the role
          command: |
            set -euo pipefail
            echo "Region: ${AWS_REGION}"
            echo "Role ARN: ${AWS_ROLE_ARN}"
            aws sts get-caller-identity
      - run:
          name: Show OIDC claims (no heredocs)
          command: |
            set -euo pipefail
            TOKEN="$(circleci run oidc get --claims "{\"aud\":\"${CIRCLE_ORGANIZATION_ID}\"}")"
            b64url() {
              in="$1"
              pad=$((4 - ${#in} % 4))
              if [ $pad -lt 4 ]; then in="$in$(printf '=%.0s' $(seq 1 $pad))"; fi
              printf '%s' "$in" | tr '_-' '/+' | base64 -d 2>/dev/null
            }
            HEADER="$(b64url "$(printf '%s' "$TOKEN" | cut -d. -f1)")"
            PAYLOAD="$(b64url "$(printf '%s' "$TOKEN" | cut -d. -f2)")"
            echo "== OIDC header ==";  echo "$HEADER"
            echo "== OIDC payload =="; echo "$PAYLOAD"
            echo "Expected project_slug: gh/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"

  # ---------------------------------------------------------------------------
  # 4) Retag + push 'latest' without rebuilding (after push succeeds)
  # ---------------------------------------------------------------------------
  retag-and-push-latest:
    docker:
      - image: cimg/base:stable
    steps:
      - aws-cli/setup:
          profile_name: default
          role_arn: ${AWS_ROLE_ARN}
          role_session_name: circleci-${CIRCLE_WORKFLOW_ID}
          region: ${AWS_REGION}
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Login to ECR
          command: |
            ACCOUNT_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            aws ecr get-login-password --region "${AWS_REGION}" \
              | docker login --username AWS --password-stdin "${ACCOUNT_URL}"
      - run:
          name: Pull SHA tag, retag as latest, push
          command: |
            ACCOUNT_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            IMAGE="${ACCOUNT_URL}/${ECR_REPOSITORY_NAME}"
            docker pull "${IMAGE}:${CIRCLE_SHA1}"
            docker tag  "${IMAGE}:${CIRCLE_SHA1}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"

# ---------------------------------------------------------------------------
# Workflow
# ---------------------------------------------------------------------------
workflows:
  build-and-test:
    jobs:
      - lint-and-unit-test
      - integration-test:
          requires:
            - lint-and-unit-test

      # 🔎 OIDC + role assumption test BEFORE building/pushing
      - aws-oidc-smoke-test:
          requires:
            - integration-test
          context:
            - aws-config

      # Build & push SHA tag using the orb job
      - aws-ecr/build_and_push_image:
          name: build-and-push-image
          requires:
            - aws-oidc-smoke-test
          context:
            - aws-config
          repo: ${ECR_REPOSITORY_NAME}
          tag: ${CIRCLE_SHA1}
          auth:
            - aws-cli/setup:
                profile_name: default
                role_arn: ${AWS_ROLE_ARN}
                role_session_name: circleci-${CIRCLE_WORKFLOW_ID}
                region: ${AWS_REGION}

      # Retag the already-pushed image as 'latest' (no rebuild)
      - retag-and-push-latest:
          requires:
            - build-and-push-image
          context:
            - aws-config
