# .circleci/config.yml
version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1
  aws-ecr: circleci/aws-ecr@9.3.5
  trivy: skedulo/trivy@0.10.0

jobs:
  # ---------------------------------------------------------------------------
  # 1) Lint and unit tests (fast, no DB)
  # ---------------------------------------------------------------------------
  lint-and-unit-test:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pip-{{ checksum "requirements.txt" }}
            - v1-pip-
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install --upgrade black pytest pytest-cov
      - save_cache:
          key: v1-pip-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Lint (black --check)
          command: black --check .
      - run:
          name: Run unit tests (tests/unit) with JUnit XML
          command: |
            mkdir -p test-results/unit
            pytest tests/unit -q --junitxml=test-results/unit/pytest.xml
      - store_test_results:
          path: test-results
          when: always

  # ---------------------------------------------------------------------------
  # 2) Integration tests (with Postgres sidecar)
  # ---------------------------------------------------------------------------
  integration-test:
    docker:
      - image: cimg/python:3.11
        environment:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/appdb
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/appdb
          PIP_CACHE_DIR: ~/.cache/pip
      - image: postgres:14-alpine
        environment:
          POSTGRES_DB: appdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pip-{{ checksum "requirements.txt" }}
            - v1-pip-
      - run:
          name: Install system & Python dependencies
          command: |
            sudo apk update || sudo apt-get update
            (sudo apk add netcat-openbsd || sudo apt-get install -y netcat-openbsd) || true
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install --upgrade pytest pytest-cov
      - save_cache:
          key: v1-pip-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Wait for Postgres to be ready
          command: |
            chmod +x scripts/wait_for_db.sh
            ./scripts/wait_for_db.sh
      - run:
          name: Run Alembic migrations
          command: alembic upgrade head
      - run:
          name: Run integration tests with JUnit XML + HTML coverage
          command: |
            mkdir -p test-results/integration
            pytest tests/integration -q \
              --junitxml=test-results/integration/pytest.xml \
              --cov=app --cov-report=term --cov-report=html:coverage_html
      - store_test_results:
          path: test-results
          when: always
      - store_artifacts:
          path: coverage_html
          destination: coverage_html

  # ---------------------------------------------------------------------------
  # 3) Build → Scan (fail on CRITICAL) + SBOM → Push (SHA + latest)
  # ---------------------------------------------------------------------------
  build-scan-and-push-image:
    docker:
      - image: cimg/base:stable
    steps:
      # Assume AWS role via OIDC (reads vars from `aws-config` context)
      - aws-cli/setup:
          profile_name: default
          role_arn: ${AWS_ROLE_ARN}
          role_session_name: circleci-${CIRCLE_WORKFLOW_ID}
          region: ${AWS_REGION}

      # Build/scan/push need Docker; enable DLC for speed
      - setup_remote_docker:
          docker_layer_caching: true

      - checkout

      # Compute image refs and ensure ECR account URL is available
      - run:
          name: Prepare image variables
          command: |
            mkdir -p reports
            : "${AWS_ECR_ACCOUNT_URL:=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com}"
            echo "export AWS_ECR_ACCOUNT_URL=${AWS_ECR_ACCOUNT_URL}" >> "$BASH_ENV"
            echo "export IMAGE=${AWS_ECR_ACCOUNT_URL}/${ECR_REPOSITORY_NAME}:${CIRCLE_SHA1}" >> "$BASH_ENV"
            echo "export SCAN_IMAGE=scan:${CIRCLE_SHA1}" >> "$BASH_ENV"
            source "$BASH_ENV"
            echo "IMAGE=$IMAGE"
            echo "SCAN_IMAGE=$SCAN_IMAGE"

      # Build the image and add a local tag for Trivy
      - run:
          name: Build Docker image (tag with SHA + local scan tag)
          command: |
            source "$BASH_ENV"
            docker build -f ./Dockerfile -t "${IMAGE}" .
            docker tag "${IMAGE}" "${SCAN_IMAGE}"

      # Fail the job if any CRITICAL vulns are found
      - trivy/validate:
          image: scan:${CIRCLE_SHA1}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          cve-ignore-list: ""

      # Write human-readable report + CycloneDX SBOM
      - run:
          name: Write Trivy report + SBOM (CycloneDX)
          command: |
            source "$BASH_ENV"
            # Text/table report
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /home/circleci/.cache:/root/.cache \
              aquasec/trivy image --no-progress \
              --severity CRITICAL \
              --ignore-unfixed=true \
              --format table "${SCAN_IMAGE}" > reports/trivy-vulnerabilities.txt || true

            # CycloneDX SBOM
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /home/circleci/.cache:/root/.cache \
              -v "$PWD/reports":/reports \
              aquasec/trivy image --no-progress \
              --format cyclonedx \
              --output /reports/sbom.cdx.json \
              "${SCAN_IMAGE}"

      # Push only after scan passed
      - aws-ecr/ecr-login
      - aws-ecr/push-image:
          repo: ${ECR_REPOSITORY_NAME}
          tag: ${CIRCLE_SHA1}
      - run:
          name: Tag image as latest
          command: |
            source "$BASH_ENV"
            docker tag "${IMAGE}" "${AWS_ECR_ACCOUNT_URL}/${ECR_REPOSITORY_NAME}:latest"
      - aws-ecr/push-image:
          repo: ${ECR_REPOSITORY_NAME}
          tag: latest

      # Upload scan outputs
      - store_artifacts:
          path: reports
          destination: reports

# ---------------------------------------------------------------------------
# Workflow: lint/unit -> integration -> build + scan + push
# ---------------------------------------------------------------------------
workflows:
  build-and-test:
    jobs:
      - lint-and-unit-test
      - integration-test:
          requires:
            - lint-and-unit-test
      - build-scan-and-push-image:
          requires:
            - integration-test
          context:
            - aws-config
