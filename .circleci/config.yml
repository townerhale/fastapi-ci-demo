# .circleci/config.yml
version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1
  aws-ecr: circleci/aws-ecr@9.3.0

jobs:
  # ---------------------------------------------------------------------------
  # 1) Lint and unit tests (fast, no DB)
  # ---------------------------------------------------------------------------
  lint-and-unit-test:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pip-{{ checksum "requirements.txt" }}
            - v1-pip-
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install --upgrade black pytest pytest-cov
      - save_cache:
          key: v1-pip-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Lint (black --check)
          command: black --check .
      - run:
          name: Run unit tests (tests/unit) with JUnit XML
          command: |
            mkdir -p test-results/unit
            pytest tests/unit -q --junitxml=test-results/unit/pytest.xml
      - store_test_results:
          path: test-results
          when: always

  # ---------------------------------------------------------------------------
  # 2) Integration tests (with Postgres sidecar)
  # ---------------------------------------------------------------------------
  integration-test:
    docker:
      - image: cimg/python:3.11
        environment:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/appdb
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/appdb
          PIP_CACHE_DIR: ~/.cache/pip
      - image: postgres:14-alpine
        environment:
          POSTGRES_DB: appdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pip-{{ checksum "requirements.txt" }}
            - v1-pip-
      - run:
          name: Install system & Python dependencies
          command: |
            sudo apk update || sudo apt-get update
            (sudo apk add netcat-openbsd || sudo apt-get install -y netcat-openbsd) || true
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install --upgrade pytest pytest-cov
      - save_cache:
          key: v1-pip-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Wait for Postgres to be ready
          command: |
            chmod +x scripts/wait_for_db.sh
            ./scripts/wait_for_db.sh
      - run:
          name: Run Alembic migrations
          command: |
            alembic upgrade head
      - run:
          name: Run integration tests with JUnit XML + HTML coverage
          command: |
            mkdir -p test-results/integration
            pytest tests/integration -q \
              --junitxml=test-results/integration/pytest.xml \
              --cov=app --cov-report=term --cov-report=html:coverage_html
      - store_test_results:
          path: test-results
          when: always
      - store_artifacts:
          path: coverage_html
          destination: coverage_html

# ---------------------------------------------------------------------------
# Workflow: run lint/unit first, then integration tests, then ECR push
# ---------------------------------------------------------------------------
workflows:
  build-and-test:
    jobs:
      - lint-and-unit-test
      - integration-test:
          requires:
            - lint-and-unit-test

      # Use the AWS ECR ORB **JOB** (not a command)
      - aws-ecr/build_and_push_image:
          name: build-and-push-image
          context: aws-config
          requires:
            - integration-test
          # OIDC auth using aws-cli orb (recommended by orb docs)
          auth:
            - aws-cli/setup:
                profile_name: default
                role_arn: "${AWS_ROLE_ARN}"
                role_session_name: "circleci-ecr"
                region: "${AWS_REGION}"
          # Build & push settings
          repo: "${ECR_REPOSITORY_NAME}"
          account-url: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          region: "${AWS_REGION}"
          dockerfile: "Dockerfile"
          path: "."
          tag: "${CIRCLE_SHA1}"
          tag-latest: true
