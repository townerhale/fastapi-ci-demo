version: 2.1
setup: true

orbs:
  path-filtering: circleci/path-filtering@0.1.5

# Flags toggled by path-filtering
parameters:
  run-tests:
    type: boolean
    default: false
  run-build-deploy:
    type: boolean
    default: false

workflows:
  setup-workflow:
    jobs:
      - path-filtering/filter:
          name: set-pipeline-flags
          base-revision: << pipeline.git.base_revision >>
          config-path: .circleci/continue.yml
          # Using a more targeted approach
          mapping: |
            (app|src|tests|\.circleci)/.* run-tests true
            (Dockerfile|requirements.*|setup\.cfg|pyproject\.toml) run-tests true
            (app|src|\.circleci)/.* run-build-deploy true
            (Dockerfile|requirements.*|setup\.cfg|pyproject\.toml) run-build-deploy true